<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Ravitaillement des véhicules par scan QR, suivi des citernes et rapports de consommation." />
    <meta name="format-detection" content="telephone=no" />
    <!-- iPhone : application plein écran depuis l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pompiste" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <title>Pompiste — Gestion du gasoil</title>
    <style>
      /* Écran de démarrage, affiché avant le chargement de l'application */
      html, body { background: #0b1220; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b1220; font-family: system-ui, sans-serif; }
      #boot img { width: 84px; height: 84px; border-radius: 22px; animation: boot 1.4s ease-in-out infinite; }
      #boot p { color: #94a3b8; font-size: 14px; letter-spacing: .04em; margin: 0; }
      @keyframes boot { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.94); opacity: .75 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><img src="/pwa-192x192.png" alt="" /><p>Pompiste</p></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
